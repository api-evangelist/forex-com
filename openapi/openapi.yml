openapi: 3.0.3
info:
  title: FOREX.com REST API
  description: >-
    The FOREX.com REST API, hosted at ciapi.cityindex.com/TradingAPI, enables
    algorithmic traders to authenticate sessions, retrieve real-time and historical
    price data, execute buy/sell orders across 80+ forex and CFD markets, and manage
    account balances, positions, and order history programmatically. Authentication
    uses a session-based header credential obtained from the /session endpoint. A
    separate FIX API is available for institutional clients.
  version: 1.0.0
  contact:
    name: FOREX.com API Support
    url: https://www.forex.com/en/help-and-support/
    email: support.en@forex.com
  termsOfService: https://www.forex.com/en-us/help-and-support/pricing-and-fees/
  x-api-id: forex-com-trading-api
  x-logo:
    url: https://www.forex.com/favicon.ico
externalDocs:
  description: FOREX.com API Trading Documentation
  url: https://www.forex.com/en/trading-tools/api-trading/
servers:
  - url: https://ciapi.cityindex.com/TradingAPI
    description: FOREX.com REST API Base URL
security:
  - SessionAuth: []
    UserNameAuth: []
tags:
  - name: Session
    description: Authentication and session management
  - name: Account
    description: Client and trading account information
  - name: Margin
    description: Account margin and cash balance
  - name: Market
    description: Market search and instrument lookup
  - name: Pricing
    description: Real-time tick history and OHLC bar history
  - name: Orders
    description: Trade order placement and management
  - name: Positions
    description: Open position management
paths:
  /session:
    post:
      operationId: createSession
      summary: Create a session (authenticate)
      description: >-
        Authenticate with FOREX.com using username, password, and AppKey. Returns
        a Session ID used as a header credential for all subsequent requests.
        The AppKey must be obtained by contacting support.en@forex.com (allow up
        to 3 business days for activation).
      tags:
        - Session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
            example:
              UserName: myusername
              Password: mypassword
              AppKey: my-app-key
              AppVersion: "1"
              AppComments: ""
      responses:
        '200':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                Session: abc123-session-id-xyz
                StatusCode: 1
  /UserAccount/ClientAndTradingAccount:
    get:
      operationId: getClientAndTradingAccount
      summary: Get client and trading account details
      description: >-
        Retrieve client and trading account details including TradingAccountId,
        account balance, available margin, and personal account information.
        The TradingAccountId is required for all order and position operations.
      tags:
        - Account
      responses:
        '200':
          description: Account information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAndTradingAccountResponse'
  /margin/ClientAccountMargin:
    get:
      operationId: getClientAccountMargin
      summary: Get client account margin information
      description: >-
        Retrieve trading account margin information including cash balance,
        margin used, and available margin for the authenticated account.
      tags:
        - Margin
      responses:
        '200':
          description: Margin information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginResponse'
  /market/fullsearchwithtags:
    get:
      operationId: searchMarketsWithTags
      summary: Search markets with tags
      description: >-
        Search for tradeable instruments (forex pairs, CFDs) by name or tag.
        Returns a list of markets with their MarketId values, which are required
        for order placement and price subscription requests.
      tags:
        - Market
      parameters:
        - name: query
          in: query
          required: true
          description: Market name or tag to search for (e.g. EUR/USD)
          schema:
            type: string
          example: EUR/USD
      responses:
        '200':
          description: Market search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSearchResponse'
  /cfd/markets:
    get:
      operationId: getCfdMarkets
      summary: Get CFD market information
      description: >-
        Retrieve market information for a specific CFD market by name. Returns
        MarketId and other market details needed for trading operations.
      tags:
        - Market
      parameters:
        - name: MarketName
          in: query
          required: true
          description: Market name to look up (e.g. USD/CAD)
          schema:
            type: string
          example: EUR/USD
      responses:
        '200':
          description: Market information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfdMarketsResponse'
  /market/{marketId}/tickhistory:
    get:
      operationId: getTickHistory
      summary: Get recent tick price history
      description: >-
        Retrieve recent tick price history for a given market. Returns bid, ask,
        and mid prices for the most recent ticks. Maximum 4,000 records per request.
      tags:
        - Pricing
      parameters:
        - name: marketId
          in: path
          required: true
          description: Market ID for the instrument
          schema:
            type: integer
          example: 400616380
        - name: PriceTicks
          in: query
          required: false
          description: Number of price ticks to return (max 4000)
          schema:
            type: integer
            maximum: 4000
            default: 1
          example: 100
        - name: priceType
          in: query
          required: false
          description: Price type to return
          schema:
            type: string
            enum: [MID, BID, ASK]
            default: MID
      responses:
        '200':
          description: Tick price history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
  /market/{marketId}/tickhistorybetween:
    get:
      operationId: getTickHistoryBetween
      summary: Get tick history between two timestamps
      description: >-
        Retrieve tick price history for a market between two UTC timestamps.
      tags:
        - Pricing
      parameters:
        - name: marketId
          in: path
          required: true
          description: Market ID for the instrument
          schema:
            type: integer
        - name: fromTimeStampUTC
          in: query
          required: true
          description: Start timestamp in UTC (Unix epoch milliseconds)
          schema:
            type: integer
            format: int64
        - name: toTimestampUTC
          in: query
          required: true
          description: End timestamp in UTC (Unix epoch milliseconds)
          schema:
            type: integer
            format: int64
        - name: priceType
          in: query
          required: false
          description: Price type to return
          schema:
            type: string
            enum: [MID, BID, ASK]
            default: MID
      responses:
        '200':
          description: Tick price history between timestamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
  /market/{marketId}/tickhistoryafter:
    get:
      operationId: getTickHistoryAfter
      summary: Get tick history after a timestamp
      description: >-
        Retrieve a number of tick price records after a given UTC timestamp.
      tags:
        - Pricing
      parameters:
        - name: marketId
          in: path
          required: true
          description: Market ID for the instrument
          schema:
            type: integer
        - name: maxResults
          in: query
          required: true
          description: Maximum number of results to return (max 4000)
          schema:
            type: integer
            maximum: 4000
        - name: fromTimeStampUTC
          in: query
          required: true
          description: Start timestamp in UTC (Unix epoch milliseconds)
          schema:
            type: integer
            format: int64
        - name: priceType
          in: query
          required: false
          description: Price type to return
          schema:
            type: string
            enum: [MID, BID, ASK]
            default: MID
      responses:
        '200':
          description: Tick price history after timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
  /market/{marketId}/tickhistorybefore:
    get:
      operationId: getTickHistoryBefore
      summary: Get tick history before a timestamp
      description: >-
        Retrieve a number of tick price records before a given UTC timestamp.
      tags:
        - Pricing
      parameters:
        - name: marketId
          in: path
          required: true
          description: Market ID for the instrument
          schema:
            type: integer
        - name: maxResults
          in: query
          required: true
          description: Maximum number of results to return (max 4000)
          schema:
            type: integer
            maximum: 4000
        - name: toTimeStampUTC
          in: query
          required: true
          description: End timestamp in UTC (Unix epoch milliseconds)
          schema:
            type: integer
            format: int64
        - name: priceType
          in: query
          required: false
          description: Price type to return
          schema:
            type: string
            enum: [MID, BID, ASK]
            default: MID
      responses:
        '200':
          description: Tick price history before timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
  /market/{marketId}/barhistory:
    get:
      operationId: getBarHistory
      summary: Get OHLC bar history
      description: >-
        Retrieve open, high, low, close (OHLC) price bar history for a market.
        Supports MINUTE, HOUR, and DAY intervals with configurable span.
      tags:
        - Pricing
      parameters:
        - name: marketId
          in: path
          required: true
          description: Market ID for the instrument
          schema:
            type: integer
        - name: interval
          in: query
          required: true
          description: Bar interval type
          schema:
            type: string
            enum: [MINUTE, HOUR, DAY]
        - name: span
          in: query
          required: true
          description: Interval span (e.g. 1 for 1-hour bars, 15 for 15-minute bars)
          schema:
            type: integer
        - name: PriceBars
          in: query
          required: false
          description: Number of price bars to return (max 4000)
          schema:
            type: integer
            maximum: 4000
            default: 1
      responses:
        '200':
          description: OHLC bar history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarHistoryResponse'
  /market/{marketId}/barhistorybetween:
    get:
      operationId: getBarHistoryBetween
      summary: Get OHLC bar history between two timestamps
      description: >-
        Retrieve OHLC price bars for a market between two UTC timestamps.
      tags:
        - Pricing
      parameters:
        - name: marketId
          in: path
          required: true
          description: Market ID for the instrument
          schema:
            type: integer
        - name: interval
          in: query
          required: true
          description: Bar interval type
          schema:
            type: string
            enum: [MINUTE, HOUR, DAY]
        - name: span
          in: query
          required: true
          description: Interval span
          schema:
            type: integer
        - name: fromTimeStampUTC
          in: query
          required: true
          description: Start timestamp in UTC (Unix epoch milliseconds)
          schema:
            type: integer
            format: int64
        - name: toTimestampUTC
          in: query
          required: true
          description: End timestamp in UTC (Unix epoch milliseconds)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OHLC bar history between timestamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarHistoryResponse'
  /market/{marketId}/barhistorybefore:
    get:
      operationId: getBarHistoryBefore
      summary: Get OHLC bar history before a timestamp
      description: >-
        Retrieve a number of OHLC bar records before a given UTC timestamp.
      tags:
        - Pricing
      parameters:
        - name: marketId
          in: path
          required: true
          description: Market ID for the instrument
          schema:
            type: integer
        - name: interval
          in: query
          required: true
          description: Bar interval type
          schema:
            type: string
            enum: [MINUTE, HOUR, DAY]
        - name: span
          in: query
          required: true
          description: Interval span
          schema:
            type: integer
        - name: maxResults
          in: query
          required: true
          description: Maximum number of results to return (max 4000)
          schema:
            type: integer
            maximum: 4000
        - name: toTimeStampUTC
          in: query
          required: true
          description: End timestamp in UTC (Unix epoch milliseconds)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OHLC bar history before timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarHistoryResponse'
  /order/newtradeorder:
    post:
      operationId: newTradeOrder
      summary: Place a new market trade order
      description: >-
        Place a new market price trade order on the FOREX.com platform. Executes
        immediately at the current market bid/ask price. Supports configurable
        direction (buy/sell), quantity, stop-loss, take-profit, and price
        tolerance for slippage control.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTradeOrderRequest'
            example:
              Direction: buy
              MarketId: 400616380
              Quantity: 10000
              MarketName: EUR/USD
              TradingAccountId: 12345678
              OfferPrice: 1.08532
              PriceTolerance: 10
              IfDone:
                - Stop:
                    TriggerPrice: 1.07500
                    Direction: sell
                    Quantity: 10000
                  Limit:
                    TriggerPrice: 1.09500
                    Direction: sell
                    Quantity: 10000
      responses:
        '200':
          description: Trade order result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeOrderResponse'
  /order/newstoplimitorder:
    post:
      operationId: newStopLimitOrder
      summary: Place a new stop or limit order
      description: >-
        Place a new stop or limit order that triggers at a specified price.
        Used for entry orders that execute when the market reaches the TriggerPrice.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStopLimitOrderRequest'
      responses:
        '200':
          description: Stop/limit order result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeOrderResponse'
  /order/activeorders:
    post:
      operationId: listActiveOrders
      summary: List active orders
      description: >-
        Retrieve a list of active (pending) orders for the specified trading account.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveOrdersRequest'
            example:
              TradingAccountId: 12345678
              MaxResults: 100
      responses:
        '200':
          description: Active orders retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveOrdersResponse'
  /order/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an active order
      description: >-
        Cancel a pending active order by its OrderId.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
            example:
              TradingAccountId: 12345678
              OrderId: 987654321
      responses:
        '200':
          description: Order cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
  /order/openpositions:
    get:
      operationId: listOpenPositions
      summary: List open trading positions
      description: >-
        Retrieve a list of all open trading positions for the specified trading
        account. Returns position details including unrealised P&L, direction,
        quantity, and current pricing.
      tags:
        - Positions
      parameters:
        - name: TradingAccountId
          in: query
          required: true
          description: Trading account ID to retrieve positions for
          schema:
            type: integer
          example: 12345678
      responses:
        '200':
          description: Open positions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPositionsResponse'
components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: header
      name: Session
      description: Session ID obtained from POST /session
    UserNameAuth:
      type: apiKey
      in: header
      name: UserName
      description: FOREX.com account username
  schemas:
    SessionRequest:
      type: object
      required:
        - UserName
        - Password
        - AppKey
      properties:
        UserName:
          type: string
          description: FOREX.com account username
        Password:
          type: string
          description: FOREX.com account password
          format: password
        AppKey:
          type: string
          description: Application key obtained from FOREX.com support
        AppVersion:
          type: string
          description: Application version identifier
          default: "1"
        AppComments:
          type: string
          description: Optional application comments
          default: ""
    SessionResponse:
      type: object
      properties:
        Session:
          type: string
          description: Session ID to use as header credential for subsequent requests
        StatusCode:
          type: integer
          description: Status code (1 = success)
    ClientAndTradingAccountResponse:
      type: object
      properties:
        TradingAccounts:
          type: array
          items:
            $ref: '#/components/schemas/TradingAccount'
        ClientAccountId:
          type: integer
        ClientAccountName:
          type: string
    TradingAccount:
      type: object
      properties:
        TradingAccountId:
          type: integer
          description: Trading account ID required for orders and positions
        TradingAccountName:
          type: string
        Currency:
          type: string
          description: Account currency (e.g. USD)
        Balance:
          type: number
          format: double
        CashAvailable:
          type: number
          format: double
        NetEquity:
          type: number
          format: double
        OpenTradeEquity:
          type: number
          format: double
        Margin:
          type: number
          format: double
        MarginIndicator:
          type: number
          format: double
        TradingAccountType:
          type: string
          description: Account type (e.g. CFD, Spread)
        TradingAccountStatus:
          type: string
    MarginResponse:
      type: object
      properties:
        Cash:
          type: number
          format: double
          description: Cash balance
        TradeableFunds:
          type: number
          format: double
        PendingFunds:
          type: number
          format: double
        TradingMargin:
          type: number
          format: double
        NetEquity:
          type: number
          format: double
        OpenTradeEquity:
          type: number
          format: double
        TotalMarginRequirement:
          type: number
          format: double
    MarketSearchResponse:
      type: object
      properties:
        Markets:
          type: array
          items:
            $ref: '#/components/schemas/Market'
    CfdMarketsResponse:
      type: object
      properties:
        Markets:
          type: array
          items:
            $ref: '#/components/schemas/Market'
    Market:
      type: object
      properties:
        MarketId:
          type: integer
          description: Unique market identifier used for orders and price subscriptions
        Name:
          type: string
          description: Market name (e.g. EUR/USD)
        WebsiteName:
          type: string
        Bid:
          type: number
          format: double
          description: Current bid price
        Offer:
          type: number
          format: double
          description: Current offer (ask) price
        High:
          type: number
          format: double
          description: Day high price
        Low:
          type: number
          format: double
          description: Day low price
        Change:
          type: number
          format: double
        PercentChange:
          type: number
          format: double
        PriceDecimalPlaces:
          type: integer
        MarketSizesCurrencyCode:
          type: string
        ExchangeId:
          type: integer
        MarketDecimals:
          type: integer
    TickHistoryResponse:
      type: object
      properties:
        PriceTicks:
          type: array
          items:
            $ref: '#/components/schemas/PriceTick'
    PriceTick:
      type: object
      properties:
        Price:
          type: number
          format: double
          description: Tick price value
        TickDate:
          type: string
          description: Tick date in /Date(milliseconds)/ format
    BarHistoryResponse:
      type: object
      properties:
        PriceBars:
          type: array
          items:
            $ref: '#/components/schemas/PriceBar'
    PriceBar:
      type: object
      properties:
        BarDate:
          type: string
          description: Bar date in /Date(milliseconds)/ format
        Open:
          type: number
          format: double
          description: Opening price
        High:
          type: number
          format: double
          description: High price
        Low:
          type: number
          format: double
          description: Low price
        Close:
          type: number
          format: double
          description: Closing price
        Volume:
          type: number
          format: double
          description: Volume (if available)
    NewTradeOrderRequest:
      type: object
      required:
        - Direction
        - MarketId
        - Quantity
        - TradingAccountId
        - OfferPrice
      properties:
        Direction:
          type: string
          enum: [buy, sell]
          description: Trade direction
        MarketId:
          type: integer
          description: Market ID for the instrument to trade
        Quantity:
          type: number
          format: double
          description: Trade quantity
        MarketName:
          type: string
          description: Market name (e.g. EUR/USD)
        TradingAccountId:
          type: integer
          description: Trading account ID
        OfferPrice:
          type: number
          format: double
          description: Offer (ask) price at time of order
        PriceTolerance:
          type: number
          format: double
          description: Slippage tolerance in pips (default 10)
          default: 10
        IfDone:
          type: array
          description: Conditional stop-loss and take-profit orders
          items:
            $ref: '#/components/schemas/IfDoneOrder'
    NewStopLimitOrderRequest:
      type: object
      required:
        - Direction
        - MarketId
        - Quantity
        - TradingAccountId
        - OfferPrice
        - TriggerPrice
      properties:
        Direction:
          type: string
          enum: [buy, sell]
          description: Trade direction
        MarketId:
          type: integer
          description: Market ID for the instrument
        Quantity:
          type: number
          format: double
          description: Trade quantity
        MarketName:
          type: string
          description: Market name
        TradingAccountId:
          type: integer
          description: Trading account ID
        OfferPrice:
          type: number
          format: double
          description: Offer price
        TriggerPrice:
          type: number
          format: double
          description: Price at which the stop/limit order triggers
        IfDone:
          type: array
          items:
            $ref: '#/components/schemas/IfDoneOrder'
    IfDoneOrder:
      type: object
      properties:
        Stop:
          $ref: '#/components/schemas/ConditionalOrder'
        Limit:
          $ref: '#/components/schemas/ConditionalOrder'
    ConditionalOrder:
      type: object
      properties:
        TriggerPrice:
          type: number
          format: double
          description: Price at which to trigger the conditional order
        Direction:
          type: string
          enum: [buy, sell]
          description: Direction of the conditional order (opposite of parent order)
        Quantity:
          type: number
          format: double
          description: Quantity for the conditional order
    TradeOrderResponse:
      type: object
      properties:
        OrderId:
          type: integer
          description: Order ID assigned to the trade
        StatusReason:
          type: integer
          description: Reason code for order status
        Status:
          type: integer
          description: Order status code
        Price:
          type: number
          format: double
          description: Execution price
        AuditId:
          type: string
          description: Audit ID for the order
    ActiveOrdersRequest:
      type: object
      required:
        - TradingAccountId
      properties:
        TradingAccountId:
          type: integer
          description: Trading account ID
        MaxResults:
          type: integer
          description: Maximum number of results to return
          default: 100
    ActiveOrdersResponse:
      type: object
      properties:
        ActiveOrders:
          type: array
          items:
            $ref: '#/components/schemas/ActiveOrder'
    ActiveOrder:
      type: object
      properties:
        OrderId:
          type: integer
        MarketId:
          type: integer
        MarketName:
          type: string
        Direction:
          type: string
          enum: [buy, sell]
        Quantity:
          type: number
          format: double
        TriggerPrice:
          type: number
          format: double
        Status:
          type: integer
        StatusReason:
          type: integer
    CancelOrderRequest:
      type: object
      required:
        - TradingAccountId
        - OrderId
      properties:
        TradingAccountId:
          type: integer
          description: Trading account ID
        OrderId:
          type: integer
          description: Order ID to cancel
    CancelOrderResponse:
      type: object
      properties:
        OrderId:
          type: integer
        StatusReason:
          type: integer
        Status:
          type: integer
    OpenPositionsResponse:
      type: object
      properties:
        OpenPositions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
    OpenPosition:
      type: object
      properties:
        OrderId:
          type: integer
          description: Order ID
        MarketId:
          type: integer
          description: Market ID
        MarketName:
          type: string
          description: Market name (e.g. EUR/USD)
        Direction:
          type: string
          enum: [buy, sell]
          description: Position direction
        Quantity:
          type: number
          format: double
          description: Position size
        Price:
          type: number
          format: double
